name: a2a-relay
version: 0.11.2
description: "Shows every inbound A2A exchange in the active TUI chat and lets the user approve or deny commands that inbound A2A sessions need approval for (/a2a-allow, /a2a-deny)."
author: "Dmitry Golubnichiy"
provides_hooks:
  - pre_approval_request
  - post_approval_response
  - pre_llm_call
  - pre_tool_call
  - post_tool_call
  - pre_gateway_dispatch
